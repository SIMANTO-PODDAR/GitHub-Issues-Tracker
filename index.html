<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - GitHub Issues Tracker</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="./img/github-logo.png" type="image/x-icon">

    <!-- Stylesheets (Tailwind CSS v4 & DaisyUI v5) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./index.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center overflow-x-hidden relative">

    <!-- Ambient Glow Blobs -->
    <div class="absolute top-1/4 left-1/4 w-[300px] h-[300px] bg-indigo-600/20 rounded-full blur-[100px] animate-float pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[250px] h-[250px] bg-violet-600/15 rounded-full blur-[90px] animate-float pointer-events-none" style="animation-delay: -3s;"></div>

    <main class="w-full max-w-md p-4 z-10">
        <!-- Login Card -->
        <div id="signIn" class="glass-panel w-full p-8 rounded-2xl shadow-2xl transition-all duration-300 relative border border-slate-800/80">
            
            <!-- Logo & Title -->
            <div class="flex flex-col items-center mb-8">
                <div class="p-3 bg-slate-900/60 rounded-2xl border border-slate-700/30 shadow-inner mb-4 transition-transform hover:scale-105 duration-300">
                    <img class="h-16 w-16 filter drop-shadow-[0_0_10px_rgba(99,102,241,0.5)]" src="./img/github-logo.png" alt="GitHub Logo">
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-linear-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    GitHub Issues Tracker
                </h1>
                <p class="text-slate-400 mt-2 text-sm text-center">
                    Enter details to manage developer repository issues
                </p>
            </div>

            <!-- Custom Error Alert Container -->
            <div id="error-toast" class="hidden flex items-center gap-2 bg-red-950/40 border border-red-500/30 text-red-200 px-4 py-3 rounded-xl mb-6 text-sm animate-fade-in-up">
                <i class="fa-solid fa-circle-exclamation text-red-500 text-base"></i>
                <span id="error-msg">Invalid Username or Password!</span>
            </div>

            <!-- Form Fields -->
            <form onsubmit="event.preventDefault(); validation();" class="space-y-5">
                
                <!-- Username -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input id="login-name" type="text" autocomplete="username"
                            class="w-full bg-slate-900/40 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none rounded-xl py-3 pl-11 pr-4 text-sm transition-all duration-200 text-slate-200 placeholder-slate-500" 
                            placeholder="Enter username" required />
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input id="login-pas" type="password" autocomplete="current-password"
                            class="w-full bg-slate-900/40 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none rounded-xl py-3 pl-11 pr-12 text-sm transition-all duration-200 text-slate-200 placeholder-slate-500" 
                            placeholder="Enter password" required />
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 text-slate-400 hover:text-slate-200 transition-colors">
                            <i id="password-toggle-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="w-full bg-linear-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/10 hover:shadow-indigo-600/20 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer mt-6">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6 flex items-center justify-center">
                <div class="border-t border-slate-800 w-full absolute"></div>
                <span class="bg-slate-900/90 dark:bg-slate-950/90 px-3 text-xs text-slate-500 relative uppercase tracking-wider">Demo Access</span>
            </div>

            <!-- Credentials Card / Fill Helper -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-4 flex flex-col items-center">
                <div class="flex items-center justify-between w-full text-xs text-slate-400 mb-3">
                    <div>
                        <span class="font-bold text-slate-300">User:</span> admin
                    </div>
                    <div>
                        <span class="font-bold text-slate-300">Pass:</span> admin123
                    </div>
                </div>
                <button onclick="autofillDemo()" class="w-full py-2 bg-slate-800/60 hover:bg-slate-800 text-indigo-400 hover:text-indigo-300 text-xs font-semibold rounded-lg border border-slate-700/30 hover:border-slate-700/60 transition-all duration-200 flex items-center justify-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-bolt-lightning text-amber-400"></i>
                    <span>Autofill Credentials</span>
                </button>
            </div>

        </div>

        <p class="text-center text-slate-600 text-xs mt-8">
            Secured admin session. Connection is encrypted.
        </p>
    </main>

    <!-- Custom Scripts -->
    <script src="./sign-in.js"></script>

</body>

</html>
